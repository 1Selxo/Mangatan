name: Build & Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish (for example v0.7.85)
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      private_release:
        description: Publish the release as a private-channel prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  PRIVATE_RELEASE: ${{ inputs.private_release || false }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: validate release tag
        shell: bash
        run: |
          version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          expected_tag="v${version%%+*}"
          version_tag="${RELEASE_TAG#private-}"

          if [[ "$PRIVATE_RELEASE" == "true" && "$RELEASE_TAG" != private-v* ]]; then
            echo "Private releases must use a private-v* tag." >&2
            exit 1
          fi
          if [[ "$PRIVATE_RELEASE" != "true" && "$RELEASE_TAG" != v* ]]; then
            echo "Public releases must use a v* tag." >&2
            exit 1
          fi

          if [[ "$version_tag" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match pubspec version $version." >&2
            echo "Expected $expected_tag (or private-$expected_tag)." >&2
            exit 1
          fi

  build-and-release-macos-dmg:
    needs: validate-release
    runs-on: macos-26
    env:
      FLUTTER_XCODE_ARCHS: arm64
    steps:
      - name: checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: flutter pub get
        run: flutter pub get

      - name: build macos
        run: |
          flutter build macos --release --verbose
          brew install create-dmg
          create-dmg --volname Mangatan-${{ env.RELEASE_TAG }}-macos-arm64 --window-pos 200 120 --window-size 800 450 --icon-size 100 --app-drop-link 600 185 Mangatan-${{ env.RELEASE_TAG }}-macos-arm64.dmg build/macos/Build/Products/Release/Mangatan.app

      - name: upload artifact macos dmg
        uses: actions/upload-artifact@v7
        with:
          name: Mangatan-${{ env.RELEASE_TAG }}-macos-arm64
          path: "Mangatan-*.dmg"
          if-no-files-found: error

  build-and-release-windows-exe_zip:
    needs: validate-release
    runs-on: windows-2022
    env:
      PUB_CACHE: 'C:\pub-cache'
      WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - name: checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Copy workspace to short path
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'C:\m') {
            Remove-Item -LiteralPath 'C:\m' -Recurse -Force
          }
          robocopy "$env:GITHUB_WORKSPACE" 'C:\m' /MIR /XD .git .dart_tool | Out-Host
          if ($LASTEXITCODE -le 7) {
            exit 0
          }
          exit $LASTEXITCODE

      - name: flutter pub get
        working-directory: C:\m
        run: flutter pub get

      - name: Require Windows code-signing certificate
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            throw 'Windows releases require WINDOWS_SIGNING_CERT_BASE64 and WINDOWS_SIGNING_CERT_PASSWORD.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'mangatan-release-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)
          )

      - name: build windows app
        working-directory: C:\m
        run: |
          dart run inno_bundle:build --release --no-installer

      - name: sign Windows application binaries
        working-directory: C:\m
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'mangatan-release-signing.pfx'
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -File -Recurse |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) {
            throw 'Could not locate the Windows SDK signing tool.'
          }

          $bundle = 'build/windows/x64/runner/Release'
          $unsigned = Get-ChildItem $bundle -File -Recurse |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq 'NotSigned' }
          foreach ($binary in $unsigned) {
            & $signTool sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $certificatePath /p $env:WINDOWS_SIGNING_CERT_PASSWORD `
              $binary.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $($binary.Name)."
            }
          }

          foreach ($requiredBinary in 'mangayomi.exe', 'screen_ai_bridge.dll') {
            $path = Join-Path $bundle $requiredBinary
            & $signTool verify /pa /all $path
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed for $requiredBinary."
            }
          }

      - name: build and sign Windows installer
        working-directory: C:\m
        shell: pwsh
        run: |
          dart run inno_bundle:build --release --no-app
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'mangatan-release-signing.pfx'
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -File -Recurse |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          $installers = @(Get-ChildItem 'build/windows/x64/installer/Release/*-Installer.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)."
          }
          & $signTool sign /fd SHA256 /td SHA256 `
            /tr http://timestamp.digicert.com `
            /f $certificatePath /p $env:WINDOWS_SIGNING_CERT_PASSWORD `
            $installers[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw 'Signing the Windows installer failed.'
          }
          & $signTool verify /pa /all $installers[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows installer signature verification failed.'
          }

      - name: build windows zip
        working-directory: C:\m
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release-windows'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $installers = @(Get-ChildItem 'build/windows/x64/installer/Release/*-Installer.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)."
          }
          Copy-Item -LiteralPath $installers[0].FullName -Destination (Join-Path $releaseDir "Mangatan-$env:RELEASE_TAG-windows.exe")

          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath (Join-Path $releaseDir "Mangatan-$env:RELEASE_TAG-windows.zip")
          Get-ChildItem $releaseDir -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii (Join-Path $releaseDir 'SHA256SUMS.txt')

      - name: upload artifact windows exe_zip
        uses: actions/upload-artifact@v7
        with:
          name: Mangatan-${{ env.RELEASE_TAG }}-windows-zip
          path: |
            release-windows/Mangatan-*.exe
            release-windows/Mangatan-*.zip
            release-windows/SHA256SUMS.txt
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs:
      - build-and-release-macos-dmg
      - build-and-release-windows-exe_zip
    runs-on: ubuntu-latest
    steps:
      - name: download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: Mangatan-${{ env.RELEASE_TAG }}-*
          path: release-packages
          merge-multiple: true

      - name: release packages
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-packages/*"
          artifactErrorsFailBuild: true
          allowUpdates: true
          immutableCreate: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          tag: ${{ env.RELEASE_TAG }}
