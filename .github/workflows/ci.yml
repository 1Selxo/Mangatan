name: CI

# Build/compile checks for pull requests and main branch for Android & Windows in debug mode.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated files (frb_generated.dart, *.g.dart, l10n) are committed, so
      # analyze runs without the Rust/codegen toolchain. Fail only on errors
      # (e.g. undefined symbols / type errors), not pre-existing infos/warnings.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-android:
    name: Build (Android debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install flutter_rust_bridge_codegen
        run: cargo install 'flutter_rust_bridge_codegen'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload Android debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangatan-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  desktop-scene-mining:
    name: Desktop scene mining (Linux)
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      CC_x86_64_unknown_linux_gnu: gcc-13
      CXX_x86_64_unknown_linux_gnu: g++-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux and FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-18 \
            cmake \
            ffmpeg \
            g++-13 \
            gcc-13 \
            libasound2-dev \
            libblkid-dev \
            libepoxy-dev \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            libsecret-1-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            ninja-build \
            pkg-config

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: flutter pub get

      - name: Test desktop mining and synthetic animated AVIF
        run: |
          flutter test --concurrency=1 \
            test/services/mining/scene_capture_timing_test.dart \
            test/services/mining/desktop_scene_capture_test.dart \
            test/services/mining/animated_avif_validator_test.dart \
            test/services/mining/anki_export_job_test.dart \
            test/services/mining/anki_connect_service_test.dart \
            test/services/mining/anki_card_builder_test.dart \
            test/services/mining/anime_sentence_audio_service_test.dart

      - name: Test community extension-repo subscription persistence (issue #37)
        run: |
          flutter test --concurrency=1 \
            test/services/community_repo_subscription_test.dart

      - name: Build Linux debug
        run: flutter build linux --debug

  build-windows:
    name: Build (Windows debug)
    runs-on: windows-2022
    env:
      CARGO_BUILD_JOBS: 2
      CARGOKIT_CACHE_ROOT: 'C:\ck'
      CARGOKIT_VERBOSE: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CMAKE_TOOLCHAIN_FILE: 'C:\ck\libarchive-windows.cmake'
      PUB_CACHE: 'C:\pub-cache'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Keep the checkout and Cargokit target paths short. The full hosted
      # runner path can make the Rust custom-build process exit without
      # surfacing Cargo's actual diagnostic through MSBuild.
      - name: Copy workspace to short path
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'C:\m') {
            Remove-Item -LiteralPath 'C:\m' -Recurse -Force
          }
          robocopy "$env:GITHUB_WORKSPACE" 'C:\m' /MIR /XD .git .dart_tool | Out-Host
          if ($LASTEXITCODE -le 7) {
            exit 0
          }
          exit $LASTEXITCODE

      - name: Install dependencies
        working-directory: C:\m
        run: flutter pub get

      - name: Prebuild Windows Rust library
        working-directory: C:\m
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:CARGOKIT_CACHE_ROOT | Out-Null
          Set-Content `
            -LiteralPath $env:CMAKE_TOOLCHAIN_FILE `
            -Value 'set(POSIX_REGEX_LIB LIBC CACHE STRING "" FORCE)'

          $sourceDir = (Resolve-Path '.').Path.Replace('\', '/')
          $sourceBytes = [Text.Encoding]::UTF8.GetBytes($sourceDir)
          $hashBytes = [Security.Cryptography.MD5]::HashData($sourceBytes)
          $projectHash = [Convert]::ToHexString($hashBytes).ToLowerInvariant()
          $targetDir = Join-Path $env:CARGOKIT_CACHE_ROOT $projectHash.Substring(0, 8)

          rustup run stable cargo build `
            --manifest-path rust/Cargo.toml `
            --package rust_lib_mangayomi `
            --target x86_64-pc-windows-msvc `
            --target-dir $targetDir

      - name: Build debug Windows
        working-directory: C:\m
        run: flutter build windows --debug

      - name: Upload Windows debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangatan-windows-debug
          path: C:\m\build\windows\x64\runner\Debug\
