syntax = "proto3";

message BackupExtensionStore {
    string indexUrl = 1;
    string name = 2;
    optional string badgeLabel = 3;
    string contactWebsite = 4;
    string signingKey = 5;
    optional string contactDiscord = 6;
    optional bool isLegacy = 7;
    optional string extensionListUrl = 8;
}
