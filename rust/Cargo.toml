[package]
name = "rust_lib_mangayomi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = { version = "=2.13.0", features = ["chrono"] }
image = "0.25.10"
chrono = "0.4.44"
futures-util = "0.3.31"
reqwest = { version = "0.13.2", default-features = false, features = ["charset", "http2", "rustls", "stream", "multipart", "socks", "brotli", "gzip"] }
# Pinned to the version reqwest 0.13 resolves so the TLS client uses one
# coherent rustls provider and trust-root type.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "1"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.16"
epub = "2.1.5"
encoding_rs = "0.8.35"
zip = { version = "8.5.0", default-features = false, features = ["deflate"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
libc = "0.2"
wasmi = "2.0.0"
scraper = "0.27.0"
ego-tree = "0.11.0"
html5ever = "=0.39.0"
once_cell = "1.21.4"
parking_lot = "0.12.5"
regex = "1.13.1"
url = "2.5.8"
anyhow = "1.0.104"

[dev-dependencies]
base64 = "0.22.1"

[build-dependencies]
cc = "1.2.58"
cmake = "0.1.54"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
