name: Build iOS sideload IPA

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS IPA
    runs-on: macos-15
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.22.1"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify native dictionary source
        run: test -f third_party/hoshidicts/CMakeLists.txt

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail

          safe_ref="${GITHUB_REF_NAME//\//-}"
          ipa_name="Mangatan-${safe_ref}-ios.ipa"
          package_dir="$RUNNER_TEMP/mangatan-ipa"
          app_path="$GITHUB_WORKSPACE/build/ios/iphoneos/Runner.app"

          test -d "$app_path"
          rm -rf "$package_dir"
          mkdir -p "$package_dir/Payload"
          cp -R "$app_path" "$package_dir/Payload/Runner.app"

          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            "$package_dir/Payload/Runner.app/Info.plist")
          test "$bundle_id" = "com.selxo.mangatan"

          (
            cd "$package_dir"
            ditto -c -k --sequesterRsrc --keepParent Payload "$ipa_name"
            unzip -t "$ipa_name"
          )

          mkdir -p "$GITHUB_WORKSPACE/release-ios"
          mv "$package_dir/$ipa_name" "$GITHUB_WORKSPACE/release-ios/$ipa_name"
          echo "ipa_name=$ipa_name" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ipa_name }}
          path: release-ios/${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach IPA to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-ios/${{ steps.package.outputs.ipa_name }}
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
