name: CI

# Build/compile checks for pull requests and main. The release workflow only
# runs on version tags, so without this nothing verifies that a PR (or main)
# actually compiles until a release is cut. This catches that earlier.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated files (frb_generated.dart, *.g.dart, l10n) are committed, so
      # analyze runs without the Rust/codegen toolchain. Fail only on errors
      # (e.g. undefined symbols / type errors), not pre-existing infos/warnings.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-android:
    name: Build (Android debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.22.1"

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install flutter_rust_bridge_codegen
        run: cargo install 'flutter_rust_bridge_codegen'

      - name: Install dependencies
        run: flutter pub get

      # Debug build: needs no signing secrets, so it also runs on fork PRs,
      # while still compiling the full Dart + Kotlin + Rust bridge.
      - name: Build debug APK
        run: flutter build apk --debug

  desktop-scene-mining:
    name: Desktop scene mining (Linux)
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      CC_x86_64_unknown_linux_gnu: gcc-13
      CXX_x86_64_unknown_linux_gnu: g++-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux and FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-18 \
            cmake \
            ffmpeg \
            g++-13 \
            gcc-13 \
            libasound2-dev \
            libblkid-dev \
            libepoxy-dev \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            libsecret-1-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            ninja-build \
            pkg-config

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: flutter pub get

      - name: Test desktop mining and synthetic animated AVIF
        run: |
          flutter test --concurrency=1 \
            test/services/mining/scene_capture_timing_test.dart \
            test/services/mining/desktop_scene_capture_test.dart \
            test/services/mining/animated_avif_validator_test.dart \
            test/services/mining/anki_export_job_test.dart \
            test/services/mining/anki_connect_service_test.dart \
            test/services/mining/anki_card_builder_test.dart \
            test/services/mining/anime_sentence_audio_service_test.dart

      - name: Build Linux debug
        run: flutter build linux --debug
