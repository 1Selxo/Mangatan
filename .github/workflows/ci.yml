name: CI

# Build/compile checks for pull requests and main branch for Android & Windows in debug mode.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test bundled Mihon integration
        run: |
          flutter test \
            test/modules/more/settings/browse/extension_server_discovery_test.dart \
            test/services/vendored_mihon_source_test.dart

      # Generated files (frb_generated.dart, *.g.dart, l10n) are committed, so
      # analyze runs without the Rust/codegen toolchain. Fail only on errors
      # (e.g. undefined symbols / type errors), not pre-existing infos/warnings.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  vendored-mihon-server:
    name: Vendored Mihon server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            third_party/mihon_server/*.gradle.kts
            third_party/mihon_server/gradle/**/*.toml
            third_party/mihon_server/gradle/wrapper/gradle-wrapper.properties

      - name: Run vendored server tests
        working-directory: third_party/mihon_server
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build bundled Mihon server
        run: scripts/build_vendored_mihon_server.sh --output "$RUNNER_TEMP/mihon_server"

      - name: Smoke-test bundled runtime and server
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/mihon_server"
          shopt -s nullglob
          jars=("$bundle"/MExtensionServer-*.jar)
          if ((${#jars[@]} != 1)); then
            echo "Expected exactly one bundled server JAR, found ${#jars[@]}." >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi
          # The app parses the installed version out of this basename, so assert
          # the bundle ships a parseable `vX.Y.Z` rather than a flattened name.
          if [[ ! "$(basename "${jars[0]}")" =~ MExtensionServer-v?[0-9]+(\.[0-9]+)+ ]]; then
            echo "Bundled JAR has no parseable version: ${jars[0]}" >&2
            exit 1
          fi
          port=47831
          mkdir -p "$RUNNER_TEMP/mihon-home"
          HOME="$RUNNER_TEMP/mihon-home" \
            "$bundle/jre/bin/java" -jar "${jars[0]}" "$port" \
            >"$RUNNER_TEMP/mihon.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/mihon.log"' EXIT
          for _ in {1..80}; do
            if capabilities=$(curl --fail --silent "http://127.0.0.1:$port/capabilities"); then
              grep -q '"mangatanMihonBridge":1' <<<"$capabilities"
              grep -q '"sourceFactory":true' <<<"$capabilities"
              # Assert the listening socket exists BEFORE the negative checks:
              # `ss` prints only a header when nothing matches, which would make
              # the three assertions below pass vacuously.
              listener=$(ss -ltnH "sport = :$port")
              if [[ -z "${listener//[[:space:]]/}" ]]; then
                echo "No listening socket found on port $port." >&2
                exit 1
              fi
              grep -q "127\.0\.0\.1:$port" <<<"$listener"
              [[ "$listener" != *"0.0.0.0:$port"* ]]
              [[ "$listener" != *"[::]:$port"* ]]
              curl --fail --silent "http://127.0.0.1:$port/stop" >/dev/null
              wait "$server_pid"
              exit 0
            fi
            sleep 0.25
          done
          exit 1

  build-android:
    name: Build (Android debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.22.1"

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install flutter_rust_bridge_codegen
        run: cargo install 'flutter_rust_bridge_codegen'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload Android debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangatan-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  desktop-scene-mining:
    name: Desktop scene mining (Linux)
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      CC_x86_64_unknown_linux_gnu: gcc-13
      CXX_x86_64_unknown_linux_gnu: g++-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux and FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-18 \
            cmake \
            ffmpeg \
            g++-13 \
            gcc-13 \
            libasound2-dev \
            libblkid-dev \
            libepoxy-dev \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            libsecret-1-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            ninja-build \
            pkg-config

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: flutter pub get

      - name: Test desktop mining and synthetic animated AVIF
        run: |
          flutter test --concurrency=1 \
            test/services/mining/scene_capture_timing_test.dart \
            test/services/mining/desktop_scene_capture_test.dart \
            test/services/mining/animated_avif_validator_test.dart \
            test/services/mining/anki_export_job_test.dart \
            test/services/mining/anki_connect_service_test.dart \
            test/services/mining/anki_card_builder_test.dart \
            test/services/mining/anime_sentence_audio_service_test.dart

      - name: Build Linux debug
        run: flutter build linux --debug

  build-windows:
    name: Build (Windows debug)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install flutter_rust_bridge_codegen
        run: cargo install 'flutter_rust_bridge_codegen'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug Windows
        run: flutter build windows --debug

      - name: Upload Windows debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangatan-windows-debug
          path: build/windows/x64/runner/Debug/
