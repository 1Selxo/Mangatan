name: Build & Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish (for example v0.7.85)
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      private_release:
        description: Publish the release as a private-channel prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  PRIVATE_RELEASE: ${{ inputs.private_release || false }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: validate release tag
        shell: bash
        run: |
          version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          expected_tag="v${version%%+*}"
          version_tag="${RELEASE_TAG#private-}"

          if [[ "$PRIVATE_RELEASE" == "true" && "$RELEASE_TAG" != private-v* ]]; then
            echo "Private releases must use a private-v* tag." >&2
            exit 1
          fi
          if [[ "$PRIVATE_RELEASE" != "true" && "$RELEASE_TAG" != v* ]]; then
            echo "Public releases must use a v* tag." >&2
            exit 1
          fi

          if [[ "$version_tag" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match pubspec version $version." >&2
            echo "Expected $expected_tag (or private-$expected_tag)." >&2
            exit 1
          fi

  build-and-release-macos-dmg:
    needs: validate-release
    runs-on: macos-26
    env:
      FLUTTER_XCODE_ARCHS: arm64
    steps:
      - name: checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: flutter pub get
        run: flutter pub get

      - name: build macos
        run: |
          flutter build macos --release --verbose
          brew install create-dmg
          create-dmg --volname Mangatan-${{ env.RELEASE_TAG }}-macos-arm64 --window-pos 200 120 --window-size 800 450 --icon-size 100 --app-drop-link 600 185 Mangatan-${{ env.RELEASE_TAG }}-macos-arm64.dmg build/macos/Build/Products/Release/Mangatan.app

      - name: upload artifact macos dmg
        uses: actions/upload-artifact@v7
        with:
          name: Mangatan-${{ env.RELEASE_TAG }}-macos-arm64
          path: "Mangatan-*.dmg"
          if-no-files-found: error

  build-and-release-windows-exe_zip:
    needs: validate-release
    runs-on: windows-2022
    env:
      PUB_CACHE: 'C:\pub-cache'
    steps:
      - name: checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Copy workspace to short path
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'C:\m') {
            Remove-Item -LiteralPath 'C:\m' -Recurse -Force
          }
          robocopy "$env:GITHUB_WORKSPACE" 'C:\m' /MIR /XD .git .dart_tool | Out-Host
          if ($LASTEXITCODE -le 7) {
            exit 0
          }
          exit $LASTEXITCODE

      - name: flutter pub get
        working-directory: C:\m
        run: flutter pub get

      - name: build windows app
        working-directory: C:\m
        run: |
          dart run inno_bundle:build --release --no-installer

      - name: build Windows installer
        working-directory: C:\m
        shell: pwsh
        run: |
          dart run inno_bundle:build --release --no-app
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: build windows zip
        working-directory: C:\m
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release-windows'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $installers = @(Get-ChildItem 'build/windows/x64/installer/Release/*-Installer.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)."
          }
          Copy-Item -LiteralPath $installers[0].FullName -Destination (Join-Path $releaseDir "Mangatan-$env:RELEASE_TAG-windows.exe")

          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath (Join-Path $releaseDir "Mangatan-$env:RELEASE_TAG-windows.zip")
          Get-ChildItem $releaseDir -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii (Join-Path $releaseDir 'SHA256SUMS.txt')

      - name: upload artifact windows exe_zip
        uses: actions/upload-artifact@v7
        with:
          name: Mangatan-${{ env.RELEASE_TAG }}-windows-zip
          path: |
            release-windows/Mangatan-*.exe
            release-windows/Mangatan-*.zip
            release-windows/SHA256SUMS.txt
          if-no-files-found: error

  build-and-release-linux:
    needs: validate-release
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      CC_x86_64_unknown_linux_gnu: gcc-13
      CXX_x86_64_unknown_linux_gnu: g++-13
    steps:
      - name: checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-18 \
            cmake \
            g++-13 \
            gcc-13 \
            libasound2-dev \
            libblkid-dev \
            libepoxy-dev \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            libsecret-1-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            ninja-build \
            pkg-config

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: flutter pub get
        run: flutter pub get

      - name: build linux
        run: flutter build linux --release --verbose

      - name: package Linux archive
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="build/linux/x64/release/bundle"
          release_dir="$GITHUB_WORKSPACE/release-linux"
          archive_name="Mangatan-$RELEASE_TAG-linux-x86_64"

          test -x "$bundle_dir/mangayomi"
          test -d "$bundle_dir/data"
          test -d "$bundle_dir/lib"

          mkdir -p "$release_dir/$archive_name"
          cp -a "$bundle_dir"/. "$release_dir/$archive_name/"
          tar -C "$release_dir" -czf "$release_dir/$archive_name.tar.gz" "$archive_name"
          rm -rf -- "${release_dir:?}/${archive_name:?}"

          (
            cd "$release_dir"
            sha256sum "$archive_name.tar.gz" > SHA256SUMS-linux.txt
          )

      - name: upload Linux release artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mangatan-${{ env.RELEASE_TAG }}-linux-x86_64
          path: |
            release-linux/Mangatan-*-linux-x86_64.tar.gz
            release-linux/SHA256SUMS-linux.txt
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs:
      - build-and-release-macos-dmg
      - build-and-release-windows-exe_zip
      - build-and-release-linux
    runs-on: ubuntu-latest
    steps:
      - name: download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: Mangatan-${{ env.RELEASE_TAG }}-*
          path: release-packages
          merge-multiple: true

      - name: release packages
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-packages/*"
          artifactErrorsFailBuild: true
          allowUpdates: true
          immutableCreate: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          tag: ${{ env.RELEASE_TAG }}

  publish-aur:
    needs: release
    if: ${{ !contains(inputs.release_tag || github.ref_name, '-') }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
    secrets: inherit
