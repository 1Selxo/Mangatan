name: Update Sideloading Source

on:
  workflow_call:
  workflow_run:
    workflows:
      - Build iOS sideload IPA
    types:
      - completed
  workflow_dispatch: # Allow manual triggering of this workflow

permissions:
  contents: write

jobs:
  update-source:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run source updater
        run: |
          python repo/update_source.py
          python -m unittest repo/test_update_source.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add repo/source.json
          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "chore(source): update iOS release [skip ci]"
            git push
          fi
