name: CI

# Build/compile checks for pull requests and main branch for Android, Android TV, iOS, macOS, Windows & Linux in debug mode.
on:
  pull_request:
    branches: [main]
  # push:
  #   branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated files (frb_generated.dart, *.g.dart, l10n) are committed, so
      # analyze runs without the Rust/codegen toolchain. Fail only on errors
      # (e.g. undefined symbols / type errors), not pre-existing infos/warnings.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-android:
    name: Build (Android debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload Android debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-android-tv:
    name: Build (Android TV debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      # Overwrite the default launcher icon (and banner) with the TV variants
      # from android/tv_res before building.
      - name: Apply TV branding
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp -f "android/tv_res/mipmap-$d/launcher_icon.png" \
                  "android/app/src/main/res/mipmap-$d/launcher_icon.png"
          done
          cp -f android/tv_res/drawable-xhdpi/tv_banner.png \
                android/app/src/main/res/drawable-xhdpi/tv_banner.png || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug TV APK
        run: flutter build apk --debug

      - name: Upload Android TV debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-android-tv-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    name: Build (iOS debug)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug iOS
        run: flutter build ios --debug --no-codesign

      - name: Upload iOS debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-ios-debug
          path: build/ios/iphoneos/Runner.app

  build-macos:
    name: Build (macOS debug)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug macOS
        run: |
          cd macos
          pod update
          cd ..
          flutter build macos --debug --verbose

      - name: Upload macOS debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-macos-debug
          path: build/macos/Build/Products/Debug/Mangayomi.app

  build-windows:
    name: Build (Windows debug)
    runs-on: windows-2022
    env:
      CARGO_BUILD_JOBS: 2
      CARGOKIT_CACHE_ROOT: 'C:\ck'
      CARGOKIT_VERBOSE: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CMAKE_TOOLCHAIN_FILE: 'C:\ck\libarchive-windows.cmake'
      PUB_CACHE: 'C:\pub-cache'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Copy workspace to short path
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'C:\m') {
            Remove-Item -LiteralPath 'C:\m' -Recurse -Force
          }
          robocopy "$env:GITHUB_WORKSPACE" 'C:\m' /MIR /XD .git .dart_tool | Out-Host
          if ($LASTEXITCODE -le 7) {
            exit 0
          }
          exit $LASTEXITCODE

      - name: Install dependencies
        working-directory: C:\m
        run: flutter pub get

      - name: Prebuild Windows Rust library
        working-directory: C:\m
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:CARGOKIT_CACHE_ROOT | Out-Null
          Set-Content `
            -LiteralPath $env:CMAKE_TOOLCHAIN_FILE `
            -Value 'set(POSIX_REGEX_LIB LIBC CACHE STRING "" FORCE)'

          $sourceDir = (Resolve-Path '.').Path.Replace('\', '/')
          $sourceBytes = [Text.Encoding]::UTF8.GetBytes($sourceDir)
          $hashBytes = [Security.Cryptography.MD5]::HashData($sourceBytes)
          $projectHash = [Convert]::ToHexString($hashBytes).ToLowerInvariant()
          $targetDir = Join-Path $env:CARGOKIT_CACHE_ROOT $projectHash.Substring(0, 8)

          rustup run stable cargo build `
            --manifest-path rust/Cargo.toml `
            --package rust_lib_mangayomi `
            --target x86_64-pc-windows-msvc `
            --target-dir $targetDir

      - name: Build debug Windows
        working-directory: C:\m
        run: flutter build windows --debug

      - name: Upload Windows debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangatan-windows-debug
          path: C:\m\build\windows\x64\runner\Debug\

  build-linux:
    name: Build (Linux debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            webkit2gtk-4.1 clang cmake ninja-build pkg-config \
            libgtk-3-dev mpv libmpv-dev dpkg-dev \
            libblkid-dev liblzma-dev libjpeg-dev \
            libpng-dev libavif-dev libsecret-1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug Linux
        run: flutter build linux --debug --verbose

      - name: Upload Linux debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-linux-debug
          path: build/linux/x64/debug/bundle/
